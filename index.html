<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HANU 🇰🇷 — Koreys tili platformasi</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function(){
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            var tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
          }
        } catch(e) {}
      })();
    </script>

    <!-- Tailwind CSS (Barcha zamonaviy dizaynlar uchun) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter va Koreyscha Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f6f5f1] dark:bg-[#121212] text-[#121212] dark:text-[#f6f5f1]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
